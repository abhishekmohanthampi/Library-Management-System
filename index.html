<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic library management system ">
    <title>Library Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script src="script.js"></script>
    <header>
        <h1>Welcome to ABC Library Management System</h1>
       
        <main>
            <div>
                <h1 id="login" ><b> <u>Login</u></b></h1>
                <button onclick="showForm('admin')">Admin</button>
                <button onclick="showForm('user')">User</button>
                <form id="userform" onsubmit="return login('user')">
                    <label id="labeluser" for="useremail">User Email:</label>
                    <input id="useremail" name="useremail" type="email" required placeholder="email"><br>
                    <label for="password">Password:</label>
                    <input id="password" name="password" type="password" required placeholder="password"><br>
                    <button type="submit">Submit</button>
                </form>
                <form id="adminform" onsubmit="return login('admin')">
                    <label for="adminemail" id="labeladmin">Admin Email:</label>
                    <input id="adminemail" name="adminemail" type="email" required placeholder="email"><br>
                    <label for="password">Password:</label>
                    <input id="password" name="password" type="password"required placeholder="password"><br>
                    <button type="submit">Submit</button>

                </form>
            </div>
        
        </main>
    </header>
<footer>
     <nav id="first-nav">
            <a href="https://example.com">Contact ME</a>
        </nav>
</footer>

    
</body>
</html>
